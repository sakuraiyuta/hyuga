[project]
name = "hyuga"
version = "1.1.0"
description = "Hyuga - Yet Another Hy Language Server"
authors = [
{name = "Yuuta Sakurai", email = "sakurai.yuta@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<3.16"
dependencies = [
    "hy>=1.3.1",
    "hyrule>=1.1.0",
    "pygls>=2.1.1",
    "toolz>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
]

[project.scripts]
hyuga = "hyuga.__main__:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  {include = "hyuga", from = "."}
]
